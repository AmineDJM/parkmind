# Render blueprint for Parkmind — zero manual configuration.
# Render provisions a dedicated PostgreSQL, wires DATABASE_URL, generates the
# secrets, shares CRON_SECRET across both services, and auto-detects the public
# URL. Nothing to fill in when deploying this Blueprint.

databases:
  - name: parkmind-db
    databaseName: parkmind
    user: parkmind
    plan: basic-256mb # dedicated paid Postgres (Render allows only one free DB/account)

# Shared secret so the cron and the web service agree on CRON_SECRET.
envVarGroups:
  - name: parkmind-shared
    envVars:
      - key: CRON_SECRET
        generateValue: true

services:
  # ── Web app ────────────────────────────────────────────────────────────────
  - type: web
    name: parkmind
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - fromGroup: parkmind-shared
      - key: NODE_ENV
        value: production
      # Dedicated database, provisioned and wired automatically by Render.
      - key: DATABASE_URL
        fromDatabase:
          name: parkmind-db
          property: connectionString
      # Generated once by Render, available at build (for edge inlining) and runtime.
      - key: AUTH_SECRET
        generateValue: true
      - key: DEFAULT_SIMULATION_MODE
        value: "true"
      - key: PARKMIND_KILL_SWITCH
        value: "false"
      - key: MAIL_DRIVER
        value: console
      - key: ADMIN_EMAILS
        value: amine.djouamaii@gmail.com
      # NEXT_PUBLIC_APP_URL is intentionally omitted: the app falls back to
      # Render's auto-injected RENDER_EXTERNAL_URL.

  # ── Automation cron (calls the secured engine endpoint every 15 min) ─────────
  - type: cron
    name: parkmind-automation
    runtime: node
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: npm ci
    startCommand: 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" "https://$WEB_HOST/api/cron/automation"'
    envVars:
      - fromGroup: parkmind-shared
      # Resolves to the web service's onrender.com hostname automatically.
      - key: WEB_HOST
        fromService:
          type: web
          name: parkmind
          property: host
